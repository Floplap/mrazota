version: "3.8"
services:
  offline-ai:
    build: .
    container_name: offline-ai
    ports:
      - "3000:3000"
    volumes:
      - ./models:/opt/offline-ai/models
      - ./bin:/opt/offline-ai/bin
      - ./tmp_uploads:/opt/offline-ai/tmp_uploads
      - ./frontend:/opt/offline-ai/frontend
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - CONFIRM_LICENSE=${CONFIRM_LICENSE:-false}
