<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pong</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; text-align: center; background: transparent; color: #fff; margin: 0; padding: 1rem; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { background: #000; border: 2px solid #0ff; box-shadow: 0 0 15px #0ff; width: 100%; max-width: 600px; aspect-ratio: 4/3; }
        h1 { color: #0ff; }
    </style>
</head>
<body>
    <h1>PONG</h1>
    <canvas id="pongCanvas"></canvas>
    <script>
        const canvas = document.getElementById('pongCanvas');
        const context = canvas.getContext('2d');
        
        canvas.width = 800;
        canvas.height = 600;

        const paddleWidth = 15, paddleHeight = 100;
        const user = { x: 10, y: canvas.height/2 - paddleHeight/2, width: paddleWidth, height: paddleHeight, color: '#0ff', score: 0 };
        const com = { x: canvas.width - paddleWidth - 10, y: canvas.height/2 - paddleHeight/2, width: paddleWidth, height: paddleHeight, color: '#f0f', score: 0 };
        const ball = { x: canvas.width/2, y: canvas.height/2, radius: 10, speed: 7, velocityX: 5, velocityY: 5, color: '#fff' };

        function drawRect(x, y, w, h, color) {
            context.fillStyle = color;
            context.fillRect(x, y, w, h);
        }

        function drawCircle(x, y, r, color) {
            context.fillStyle = color;
            context.beginPath();
            context.arc(x, y, r, 0, Math.PI*2, false);
            context.closePath();
            context.fill();
        }

        function drawText(text, x, y, color) {
            context.fillStyle = color;
            context.font = '45px "Courier New"';
            context.fillText(text, x, y);
        }

        function render() {
            drawRect(0, 0, canvas.width, canvas.height, '#000');
            drawText(user.score, canvas.width/4, canvas.height/5, user.color);
            drawText(com.score, 3*canvas.width/4, canvas.height/5, com.color);
            drawRect(user.x, user.y, user.width, user.height, user.color);
            drawRect(com.x, com.y, com.width, com.height, com.color);
            drawCircle(ball.x, ball.y, ball.radius, ball.color);
        }

        canvas.addEventListener('mousemove', movePaddle);
        canvas.addEventListener('touchmove', movePaddle);

        function movePaddle(evt) {
            let rect = canvas.getBoundingClientRect();
            let root = document.documentElement;
            let newY;
            if (evt.type === 'touchmove') {
                newY = evt.touches[0].clientY - rect.top - root.scrollTop;
            } else {
                newY = evt.clientY - rect.top - root.scrollTop;
            }
            user.y = newY - user.height/2;
        }

        function collision(b, p) {
            b.top = b.y - b.radius;
            b.bottom = b.y + b.radius;
            b.left = b.x - b.radius;
            b.right = b.x + b.radius;

            p.top = p.y;
            p.bottom = p.y + p.height;
            p.left = p.x;
            p.right = p.x + p.width;

            return b.right > p.left && b.bottom > p.top && b.left < p.right && b.top < p.bottom;
        }

        function resetBall() {
            ball.x = canvas.width/2;
            ball.y = canvas.height/2;
            ball.speed = 7;
            ball.velocityX = -ball.velocityX;
        }

        function update() {
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // AI paddle movement
            com.y += (ball.y - (com.y + com.height/2)) * 0.1;

            if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
                ball.velocityY = -ball.velocityY;
            }

            let player = (ball.x < canvas.width/2) ? user : com;
            if (collision(ball, player)) {
                let collidePoint = (ball.y - (player.y + player.height/2));
                collidePoint = collidePoint / (player.height/2);
                let angleRad = (Math.PI/4) * collidePoint;
                let direction = (ball.x < canvas.width/2) ? 1 : -1;
                ball.velocityX = direction * ball.speed * Math.cos(angleRad);
                ball.velocityY = ball.speed * Math.sin(angleRad);
                ball.speed += 0.5;
            }

            if (ball.x - ball.radius < 0) {
                com.score++;
                resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                user.score++;
                resetBall();
            }
        }

        function game() {
            update();
            render();
        }

        setInterval(game, 1000/60);
    </script>
</body>
</html>
