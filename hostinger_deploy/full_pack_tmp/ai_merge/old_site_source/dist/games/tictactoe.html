<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe with AI</title>
    <style>
        :root {
            font-size: 16px;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            background-color: transparent; 
            color: #fff; 
            margin: 0; 
            padding: 1rem; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        h1 { font-size: 1.5rem; color: #f0f8ff; margin: 0; }
        #board { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            width:100%;
        }
        .cell { 
            width: 100%; 
            aspect-ratio: 1 / 1; 
            background-color: rgba(255,255,255,0.1); 
            border: 2px solid #555; 
            border-radius: 8px; 
            font-size: clamp(2rem, 15vw, 4rem); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            transition: background-color 0.3s; 
        }
        .cell:hover { background-color: rgba(255,255,255,0.2); }
        #status { font-size: 1.25rem; min-height: 1.5em; color: #f0f8ff; }
        button { 
            padding: 0.75rem 1.25rem; 
            font-size: 1rem; 
            cursor: pointer; 
            border: none; 
            border-radius: 4px; 
            background-color: #f44336; 
            color: white; 
            transition: background-color 0.3s;
        }
        button:hover { background-color: #e53935; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe vs AI</h1>
        <div id="board"></div>
        <div id="status">Your turn (X)</div>
        <button onclick="resetGame()">Reset Game</button>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;

        function createBoard() {
            boardElement.innerHTML = '';
            board.forEach((cell, index) => {
                const cellElement = document.createElement('div');
                cellElement.classList.add('cell');
                cellElement.dataset.index = index;
                cellElement.textContent = cell;
                cellElement.addEventListener('click', handleCellClick);
                boardElement.appendChild(cellElement);
            });
        }

        function handleCellClick(event) {
            const index = event.target.dataset.index;
            if (board[index] !== '' || !gameActive || currentPlayer !== 'X') {
                return;
            }
            makeMove(index, 'X');
            if (gameActive) {
                currentPlayer = 'O';
                statusElement.textContent = "AI's turn (O)";
                setTimeout(aiMove, 500);
            }
        }

        function makeMove(index, player) {
            if (!gameActive) return;
            board[index] = player;
            document.querySelector(`.cell[data-index='${index}']`).textContent = player;
            if (checkWinner(player)) {
                statusElement.textContent = `${player} wins!`;
                gameActive = false;
            } else if (board.every(cell => cell !== '')) {
                statusElement.textContent = "It's a draw!";
                gameActive = false;
            }
        }

        function aiMove() {
            if (!gameActive) return;
            const bestMove = findBestMove();
            if (bestMove !== -1) {
                makeMove(bestMove, 'O');
            }
            if (gameActive) {
                currentPlayer = 'X';
                statusElement.textContent = "Your turn (X)";
            }
        }

        function findBestMove() {
            // AI to win
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    if (checkWinner('O')) {
                        board[i] = '';
                        return i;
                    }
                    board[i] = '';
                }
            }
            // Block player from winning
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'X';
                    if (checkWinner('X')) {
                        board[i] = '';
                        return i;
                    }
                    board[i] = '';
                }
            }
            // Take center
            if (board[4] === '') return 4;
            // Take corner
            const corners = [0, 2, 6, 8];
            const emptyCorners = corners.filter(i => board[i] === '');
            if (emptyCorners.length > 0) return emptyCorners[Math.floor(Math.random() * emptyCorners.length)];
            // Take side
            const sides = [1, 3, 5, 7];
            const emptySides = sides.filter(i => board[i] === '');
            if (emptySides.length > 0) return emptySides[Math.floor(Math.random() * emptySides.length)];
            
            return board.findIndex(cell => cell === '');
        }
        
        function checkWinner(player) {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];
            return winPatterns.some(pattern => pattern.every(index => board[index] === player));
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            statusElement.textContent = "Your turn (X)";
            createBoard();
        }

        window.onload = createBoard;
    </script>
</body>
</html>
