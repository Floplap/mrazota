<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Quiz Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: transparent; color: #fff; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #quiz-container div { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #444; }
        #quiz-container div:last-child { border-bottom: none; }
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; color: white; transition: background-color 0.3s; font-size: 16px; margin: 5px;}
        #new-quiz-btn { background-color: #2196F3; }
        #new-quiz-btn:hover { background-color: #1E88E5; }
        #check-answers-btn { background-color: #4CAF50; }
        #check-answers-btn:hover { background-color: #45a049; }
        .correct { color: #81C784; font-weight: bold; }
        .incorrect { color: #E57373; text-decoration: line-through; }
        label { display: block; margin: 8px 0; background-color: rgba(255,255,255,0.1); padding: 10px; border-radius: 5px; cursor: pointer; transition: background-color 0.2s;}
        label:hover { background-color: rgba(255,255,255,0.2); }
        input[type="radio"] { margin-right: 10px; }
        h1 { color: #f0f8ff; }
        p { color: #ddd; }
        #score { font-size: 1.2em; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quick Quiz</h1>
        <div id="quiz-container"></div>
        <button id="new-quiz-btn" onclick="generateQuiz()">New Quiz</button>
        <button id="check-answers-btn" onclick="checkAnswers()">Check Answers</button>
        <p id="score"></p>
    </div>

    <script>
        const quizData = [
            { question: "What is the capital of France?", answers: ["Berlin", "Madrid", "Paris", "Rome"], correct: "Paris" },
            { question: "Which planet is known as the Red Planet?", answers: ["Earth", "Mars", "Jupiter", "Venus"], correct: "Mars" },
            { question: "What is the largest ocean on Earth?", answers: ["Atlantic", "Indian", "Arctic", "Pacific"], correct: "Pacific" },
            { question: "Who wrote 'To Kill a Mockingbird'?", answers: ["Harper Lee", "J.K. Rowling", "Ernest Hemingway", "Mark Twain"], correct: "Harper Lee" },
            { question: "What is the chemical symbol for water?", answers: ["O2", "H2O", "CO2", "NaCl"], correct: "H2O" }
        ];

        const quizContainer = document.getElementById('quiz-container');
        const scoreElement = document.getElementById('score');
        let currentQuiz = [];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generateQuiz() {
            scoreElement.textContent = '';
            currentQuiz = shuffle([...quizData]).slice(0, 3); // Get 3 random questions
            quizContainer.innerHTML = '';
            currentQuiz.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                let answersHtml = `<p>${index + 1}. ${q.question}</p>`;
                const shuffledAnswers = shuffle([...q.answers]);
                shuffledAnswers.forEach(answer => {
                    answersHtml += `
                        <label>
                            <input type="radio" name="question${index}" value="${answer}">
                            ${answer}
                        </label>
                    `;
                });
                questionDiv.innerHTML = answersHtml;
                quizContainer.appendChild(questionDiv);
            });
        }

        function checkAnswers() {
            let score = 0;
            currentQuiz.forEach((q, index) => {
                const selected = document.querySelector(`input[name="question${index}"]:checked`);
                const labels = document.querySelectorAll(`input[name="question${index}"]`);
                
                labels.forEach(input => {
                    const label = input.parentElement;
                    label.classList.remove('correct', 'incorrect');
                    if (input.value === q.correct) {
                        label.classList.add('correct');
                    }
                });

                if (selected) {
                    if (selected.value !== q.correct) {
                        selected.parentElement.classList.add('incorrect');
                    } else {
                        score++;
                    }
                }
            });
            scoreElement.textContent = `Your score: ${score} out of ${currentQuiz.length}`;
        }

        window.onload = generateQuiz;
    </script>
</body>
</html>
