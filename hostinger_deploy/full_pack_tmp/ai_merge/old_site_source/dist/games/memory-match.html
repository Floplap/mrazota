<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; background: transparent; color: #fff; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { color: #f0f8ff; }
        #game-board { display: grid; grid-template-columns: repeat(4, minmax(60px, 1fr)); gap: 10px; margin: 20px auto; justify-content: center; max-width: 450px; width: 100%;}
        .card { aspect-ratio: 1 / 1; background-color: #4a90e2; border-radius: 8px; cursor: pointer; position: relative; transform-style: preserve-3d; transition: transform 0.5s; }
        .card.flipped, .card.matched { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; justify-content: center; align-items: center; font-size: clamp(24px, 8vw, 40px); border-radius: 8px; }
        .card-front { background-color: #4a90e2; border: 2px solid #357ABD; }
        .card-back { transform: rotateY(180deg); background-color: #fff; color: #333;}
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; background-color: #f44336; color: white; margin-top: 10px; transition: background-color 0.3s;}
        button:hover { background-color: #e53935; }
        p { color: #ddd; font-size: 18px; }
    </style>
</head>
<body>
    <h1>Memory Match</h1>
    <div id="game-board"></div>
    <p>Moves: <span id="moves">0</span></p>
    <button onclick="initGame()">New Game</button>

    <script>
        const board = document.getElementById('game-board');
        const movesSpan = document.getElementById('moves');
        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
        let cards = [...emojis, ...emojis];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let lockBoard = false;

        function shuffle(array) {
            array.sort(() => Math.random() - 0.5);
        }

        function initGame() {
            shuffle(cards);
            board.innerHTML = '';
            matchedPairs = 0;
            moves = 0;
            movesSpan.textContent = moves;
            flippedCards = [];
            lockBoard = false;
            
            cards.forEach(emoji => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji;
                card.innerHTML = `
                    <div class="card-face card-front"></div>
                    <div class="card-face card-back">${emoji}</div>
                `;
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard || this.classList.contains('flipped')) return;
            
            this.classList.add('flipped');
            flippedCards.push(this);
            
            if (flippedCards.length === 2) {
                moves++;
                movesSpan.textContent = moves;
                checkForMatch();
            }
        }

        function checkForMatch() {
            const [card1, card2] = flippedCards;
            if (card1.dataset.emoji === card2.dataset.emoji) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                flippedCards = [];
                if (matchedPairs === emojis.length) {
                    setTimeout(() => alert(`You won in ${moves} moves!`), 500);
                }
            } else {
                lockBoard = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 1000);
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
