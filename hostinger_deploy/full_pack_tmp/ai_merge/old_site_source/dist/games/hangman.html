<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: transparent; color: #fff; margin: 0; padding: 1rem; box-sizing: border-box; }
        .container { max-width: 600px; margin: auto; }
        #word-container { font-size: 2rem; letter-spacing: 0.5em; margin: 2rem 0; }
        #letters-container { margin: 2rem 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .letter-btn { width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; background: #555; border: 1px solid #777; color: #fff; border-radius: 5px; }
        .letter-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        #hangman-svg { max-width: 200px; height: auto; }
        .hangman-part { stroke: #fff; stroke-width: 4; fill: none; display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Hangman</h1>
    <svg id="hangman-svg" viewBox="0 0 200 250">
        <line class="hangman-part" id="gallow-base" x1="10" y1="230" x2="130" y2="230" />
        <line class="hangman-part" id="gallow-pole" x1="70" y1="230" x2="70" y2="20" />
        <line class="hangman-part" id="gallow-beam" x1="70" y1="20" x2="150" y2="20" />
        <line class="hangman-part" id="gallow-rope" x1="150" y1="20" x2="150" y2="50" />
        <circle class="hangman-part" id="head" cx="150" cy="70" r="20" />
        <line class="hangman-part" id="body" x1="150" y1="90" x2="150" y2="150" />
        <line class="hangman-part" id="left-arm" x1="150" y1="110" x2="120" y2="100" />
        <line class="hangman-part" id="right-arm" x1="150" y1="110" x2="180" y2="100" />
        <line class="hangman-part" id="left-leg" x1="150" y1="150" x2="120" y2="180" />
        <line class="hangman-part" id="right-leg" x1="150" y1="150" x2="180" y2="180" />
    </svg>
    <div id="word-container"></div>
    <div id="letters-container"></div>
    <p id="status"></p>
    <button onclick="initGame()">New Game</button>
</div>

<script>
    const words = ["react", "javascript", "tailwind", "supabase", "vite", "hostinger", "developer"];
    const wordContainer = document.getElementById('word-container');
    const lettersContainer = document.getElementById('letters-container');
    const statusElement = document.getElementById('status');
    const hangmanParts = document.querySelectorAll('.hangman-part');

    let selectedWord = '';
    let guessedLetters = [];
    let wrongGuesses = 0;

    function initGame() {
        selectedWord = words[Math.floor(Math.random() * words.length)];
        guessedLetters = [];
        wrongGuesses = 0;
        statusElement.textContent = '';
        
        wordContainer.innerHTML = selectedWord.split('').map(() => '_').join('');
        
        lettersContainer.innerHTML = 'abcdefghijklmnopqrstuvwxyz'.split('').map(letter => 
            `<button class="letter-btn" onclick="handleGuess('${letter}')">${letter}</button>`
        ).join('');
        
        hangmanParts.forEach(part => part.style.display = 'none');
    }

    function handleGuess(letter) {
        if (guessedLetters.includes(letter)) return;
        guessedLetters.push(letter);
        
        const letterButtons = document.querySelectorAll('.letter-btn');
        letterButtons.forEach(btn => {
            if(btn.innerText === letter) btn.disabled = true;
        });

        if (selectedWord.includes(letter)) {
            updateWordDisplay();
            checkWin();
        } else {
            wrongGuesses++;
            updateHangman();
            checkLoss();
        }
    }

    function updateWordDisplay() {
        wordContainer.innerHTML = selectedWord.split('').map(letter => 
            guessedLetters.includes(letter) ? letter : '_'
        ).join('');
    }

    function updateHangman() {
        if (wrongGuesses > 0 && wrongGuesses <= hangmanParts.length) {
            hangmanParts[wrongGuesses - 1].style.display = 'block';
        }
    }

    function checkWin() {
        if (selectedWord.split('').every(letter => guessedLetters.includes(letter))) {
            statusElement.textContent = 'You Win!';
            disableAllButtons();
        }
    }

    function checkLoss() {
        if (wrongGuesses >= hangmanParts.length) {
            statusElement.textContent = `You Lose! The word was "${selectedWord}"`;
            disableAllButtons();
        }
    }
    
    function disableAllButtons() {
        const letterButtons = document.querySelectorAll('.letter-btn');
        letterButtons.forEach(btn => btn.disabled = true);
    }

    window.onload = initGame;
</script>
</body>
</html>
