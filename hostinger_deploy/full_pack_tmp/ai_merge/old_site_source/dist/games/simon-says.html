<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simon Says</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; text-align: center; background: transparent; color: #fff; margin: 0; padding: 1rem; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 400px; aspect-ratio: 1/1; position: relative; }
        .pad { width: 100%; height: 100%; border-radius: 20px; cursor: pointer; transition: opacity 0.1s; }
        .pad:active, .pad.lit { opacity: 0.7; }
        #green { background-color: #0f0; }
        #red { background-color: #f00; }
        #yellow { background-color: #ff0; }
        #blue { background-color: #00f; }
        #center-console { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50%; height: 50%; background: #222; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 5px solid #444; }
        #start-btn { padding: 10px; font-size: 1rem; cursor: pointer; }
        #score { font-size: 1.5rem; }
    </style>
</head>
<body>
    <h1>Simon Says</h1>
    <div class="container">
        <div class="pad" id="green"></div>
        <div class="pad" id="red"></div>
        <div class="pad" id="yellow"></div>
        <div class="pad" id="blue"></div>
        <div id="center-console">
            <div id="score">0</div>
            <button id="start-btn">Start</button>
        </div>
    </div>
    <script>
        const pads = { green: 0, red: 1, yellow: 2, blue: 3 };
        const padElements = document.querySelectorAll('.pad');
        const startBtn = document.getElementById('start-btn');
        const scoreEl = document.getElementById('score');

        let sequence = [];
        let playerSequence = [];
        let score = 0;
        let gameActive = false;

        startBtn.addEventListener('click', startGame);

        padElements.forEach(pad => {
            pad.addEventListener('click', () => padClick(pad.id));
        });

        function startGame() {
            sequence = [];
            playerSequence = [];
            score = 0;
            scoreEl.textContent = score;
            gameActive = true;
            startBtn.disabled = true;
            nextRound();
        }

        function nextRound() {
            playerSequence = [];
            sequence.push(Object.keys(pads)[Math.floor(Math.random() * 4)]);
            playSequence();
        }

        function playSequence() {
            let i = 0;
            const interval = setInterval(() => {
                if (i >= sequence.length) {
                    clearInterval(interval);
                    return;
                }
                lightUp(sequence[i]);
                i++;
            }, 800);
        }

        function lightUp(padId) {
            const pad = document.getElementById(padId);
            pad.classList.add('lit');
            setTimeout(() => pad.classList.remove('lit'), 400);
        }

        function padClick(padId) {
            if (!gameActive) return;
            lightUp(padId);
            playerSequence.push(padId);
            checkPlayerInput();
        }

        function checkPlayerInput() {
            const currentStep = playerSequence.length - 1;
            if (playerSequence[currentStep] !== sequence[currentStep]) {
                gameOver();
                return;
            }

            if (playerSequence.length === sequence.length) {
                score++;
                scoreEl.textContent = score;
                setTimeout(nextRound, 1000);
            }
        }

        function gameOver() {
            alert(`Game Over! Your score: ${score}`);
            gameActive = false;
            startBtn.disabled = false;
        }
    </script>
</body>
</html>
