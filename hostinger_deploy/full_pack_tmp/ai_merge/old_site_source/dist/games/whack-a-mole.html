<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Whack-a-Mole</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; text-align: center; background: transparent; color: #fff; margin: 0; padding: 1rem; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        h1 { color: #9f7aea; }
        #game-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 350px; margin: 1rem auto; }
        .hole { width: 100%; aspect-ratio: 1/1; background: #333; border-radius: 50%; border: 5px solid #555; position: relative; overflow: hidden; }
        .mole { background: #a0522d; width: 70%; height: 70%; border-radius: 50%; position: absolute; top: 100%; left: 15%; transition: top 0.2s; cursor: pointer; }
        .mole.up { top: 25%; }
        #score, #time { font-size: 1.5rem; }
        button { background: #9f7aea; color: #fff; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 5px; cursor: pointer; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>Whack-a-Mole</h1>
    <h2>Score: <span id="score">0</span></h2>
    <h2>Time Left: <span id="time">30</span></h2>
    <div id="game-board"></div>
    <button id="start-btn">Start Game</button>

    <script>
        const board = document.getElementById('game-board');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startBtn = document.getElementById('start-btn');

        let holes = [];
        let score = 0;
        let time = 30;
        let gameInterval;
        let moleInterval;

        for (let i = 0; i < 9; i++) {
            const hole = document.createElement('div');
            hole.classList.add('hole');
            const mole = document.createElement('div');
            mole.classList.add('mole');
            mole.addEventListener('click', whack);
            hole.appendChild(mole);
            board.appendChild(hole);
            holes.push(mole);
        }

        startBtn.addEventListener('click', startGame);

        function startGame() {
            score = 0;
            time = 30;
            scoreEl.textContent = score;
            timeEl.textContent = time;
            startBtn.disabled = true;

            gameInterval = setInterval(() => {
                time--;
                timeEl.textContent = time;
                if (time <= 0) {
                    endGame();
                }
            }, 1000);

            moleInterval = setInterval(popMole, 800);
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(moleInterval);
            alert(`Game Over! Your final score is ${score}`);
            startBtn.disabled = false;
        }

        function popMole() {
            holes.forEach(mole => mole.classList.remove('up'));
            const randomHole = holes[Math.floor(Math.random() * holes.length)];
            randomHole.classList.add('up');
        }

        function whack(e) {
            if (!e.target.classList.contains('up')) return;
            score++;
            scoreEl.textContent = score;
            e.target.classList.remove('up');
        }
    </script>
</body>
</html>
