<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Snake</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            background-color: transparent;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 100%;
            max-width: 400px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; text-align: center;}
        p { font-size: 1rem; margin-top: 0; text-align: center;}
        canvas {
            background-color: #000;
            border: 2px solid #0f0;
            box-shadow: 0 0 20px #0f0;
            width: 100%;
            height: auto;
            aspect-ratio: 1/1;
        }
        #controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 200px;
            margin-top: 1rem;
        }
        .ctrl-btn {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #0f0;
            color: #0f0;
            font-size: 1.5rem;
            padding: 0.5rem;
            cursor: pointer;
            user-select: none;
            aspect-ratio: 1/1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #up { grid-column: 2; }
        #left { grid-column: 1; grid-row: 2; }
        #down { grid-column: 2; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }
        #start-btn { background: #555; border: 1px solid #777; color: #fff; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; font-size: 1rem; margin-bottom: 1rem;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Neon Snake</h1>
        <p>Score: <span id="score">0</span></p>
        <canvas id="game"></canvas>
        <button id="start-btn" onclick="startGame()">Start Game</button>
        <div id="controls">
            <button id="up" class="ctrl-btn">↑</button>
            <button id="left" class="ctrl-btn">←</button>
            <button id="down" class="ctrl-btn">↓</button>
            <button id="right" class="ctrl-btn">→</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        
        const baseSize = 400;
        canvas.width = baseSize;
        canvas.height = baseSize;

        const grid = 20;
        let count = 0;
        let score = 0;
        let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
        let apple = { x: 320, y: 320 };
        let gameRunning = false;
        let loopId;

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function loop() {
            loopId = requestAnimationFrame(loop);

            if (++count < 4) { return; } 
            count = 0;
            context.clearRect(0, 0, canvas.width, canvas.height);

            snake.x += snake.dx;
            snake.y += snake.dy;

            if (snake.x < 0) snake.x = canvas.width - grid;
            else if (snake.x >= canvas.width) snake.x = 0;
            if (snake.y < 0) snake.y = canvas.height - grid;
            else if (snake.y >= canvas.height) snake.y = 0;

            snake.cells.unshift({ x: snake.x, y: snake.y });
            if (snake.cells.length > snake.maxCells) snake.cells.pop();

            context.fillStyle = '#f0f';
            context.shadowBlur = 20;
            context.shadowColor = '#f0f';
            context.fillRect(apple.x, apple.y, grid - 1, grid - 1);

            context.fillStyle = '#0f0';
            context.shadowBlur = 20;
            context.shadowColor = '#0f0';
            snake.cells.forEach((cell, index) => {
                context.fillRect(cell.x, cell.y, grid - 1, grid - 1);
                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    score++;
                    scoreElement.textContent = score;
                    apple.x = getRandomInt(0, canvas.width / grid) * grid;
                    apple.y = getRandomInt(0, canvas.height / grid) * grid;
                }
                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        endGame();
                    }
                }
            });
        }
        
        function startGame() {
            if (gameRunning) {
                cancelAnimationFrame(loopId);
            }
            gameRunning = true;
            document.getElementById('start-btn').textContent = "Restart";
            snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
            apple = { x: getRandomInt(0, canvas.width / grid) * grid, y: getRandomInt(0, canvas.height / grid) * grid };
            score = 0;
            scoreElement.textContent = score;
            loop();
        }
        
        function endGame() {
            gameRunning = false;
            cancelAnimationFrame(loopId);
            alert('Game Over! Score: ' + score);
        }

        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            if (e.key === 'ArrowLeft' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            else if (e.key === 'ArrowUp' && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
            else if (e.key === 'ArrowRight' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
            else if (e.key === 'ArrowDown' && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
        });
        
        document.getElementById('up').addEventListener('click', () => { if (gameRunning && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; } });
        document.getElementById('down').addEventListener('click', () => { if (gameRunning && snake.dy === 0) { snake.dy = grid; snake.dx = 0; } });
        document.getElementById('left').addEventListener('click', () => { if (gameRunning && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; } });
        document.getElementById('right').addEventListener('click', () => { if (gameRunning && snake.dx === 0) { snake.dx = grid; snake.dy = 0; } });

    </script>
</body>
</html>
