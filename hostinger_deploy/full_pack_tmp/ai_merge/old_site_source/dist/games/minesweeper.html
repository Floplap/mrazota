<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minesweeper</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: transparent; color: #fff; margin: 0; padding: 1rem; box-sizing: border-box; }
        #grid-container { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; background: #333; padding: 5px; border-radius: 6px; max-width: 400px; margin: 1rem auto; aspect-ratio: 1/1; }
        .grid-cell { background: #777; border: 2px solid; border-color: #999 #666 #666 #999; aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; user-select: none; }
        .revealed { background: #bbb; border-color: #bbb; }
        .bomb { background: red; }
        .flagged::after { content: '🚩'; }
        .c1 { color: blue; } .c2 { color: green; } .c3 { color: red; } .c4 { color: purple; } .c5 { color: maroon; } .c6 { color: turquoise; } .c7 { color: black; } .c8 { color: gray; }
    </style>
</head>
<body>
    <h1>Minesweeper</h1>
    <p>Mines: <span id="mines-count">10</span></p>
    <div id="grid-container"></div>
    <button onclick="initGame()">New Game</button>
    <script>
        const grid = document.getElementById('grid-container');
        const minesCountSpan = document.getElementById('mines-count');
        const width = 10;
        const bombAmount = 10;
        let squares = [];
        let flags = 0;
        let isGameOver = false;

        function createBoard() {
            grid.style.gridTemplateColumns = `repeat(${width}, 1fr)`;
            const bombsArray = Array(bombAmount).fill('bomb');
            const emptyArray = Array(width * width - bombAmount).fill('valid');
            const gameArray = emptyArray.concat(bombsArray).sort(() => Math.random() - 0.5);

            for (let i = 0; i < width * width; i++) {
                const square = document.createElement('div');
                square.setAttribute('id', i);
                square.classList.add('grid-cell');
                square.classList.add(gameArray[i]);
                grid.appendChild(square);
                squares.push(square);

                square.addEventListener('click', function(e) { click(square); });
                square.addEventListener('contextmenu', function(e) { e.preventDefault(); addFlag(square); });
            }

            for (let i = 0; i < squares.length; i++) {
                let total = 0;
                const isLeftEdge = (i % width === 0);
                const isRightEdge = (i % width === width - 1);

                if (squares[i].classList.contains('valid')) {
                    if (i > 0 && !isLeftEdge && squares[i - 1].classList.contains('bomb')) total++;
                    if (i > 9 && !isRightEdge && squares[i + 1 - width].classList.contains('bomb')) total++;
                    if (i > 10 && squares[i - width].classList.contains('bomb')) total++;
                    if (i > 11 && !isLeftEdge && squares[i - 1 - width].classList.contains('bomb')) total++;
                    if (i < 99 && !isRightEdge && squares[i + 1].classList.contains('bomb')) total++;
                    if (i < 90 && !isLeftEdge && squares[i - 1 + width].classList.contains('bomb')) total++;
                    if (i < 88 && !isRightEdge && squares[i + 1 + width].classList.contains('bomb')) total++;
                    if (i < 89 && squares[i + width].classList.contains('bomb')) total++;
                    squares[i].setAttribute('data', total);
                }
            }
        }
        
        function initGame() {
            isGameOver = false;
            flags = 0;
            grid.innerHTML = '';
            squares = [];
            minesCountSpan.textContent = bombAmount;
            createBoard();
        }

        function addFlag(square) {
            if (isGameOver) return;
            if (!square.classList.contains('revealed') && (flags < bombAmount)) {
                if (!square.classList.contains('flagged')) {
                    square.classList.add('flagged');
                    flags++;
                    minesCountSpan.textContent = bombAmount - flags;
                    checkForWin();
                } else {
                    square.classList.remove('flagged');
                    flags--;
                    minesCountSpan.textContent = bombAmount - flags;
                }
            }
        }

        function click(square) {
            if (isGameOver || square.classList.contains('revealed') || square.classList.contains('flagged')) return;
            if (square.classList.contains('bomb')) {
                gameOver();
            } else {
                let total = square.getAttribute('data');
                if (total != 0) {
                    square.classList.add('revealed');
                    square.classList.add(`c${total}`);
                    square.innerHTML = total;
                    return;
                }
                checkSquare(square);
            }
            square.classList.add('revealed');
            checkForWin();
        }

        function checkSquare(square) {
            const currentId = parseInt(square.id);
            const isLeftEdge = (currentId % width === 0);
            const isRightEdge = (currentId % width === width - 1);

            setTimeout(() => {
                if (currentId > 0 && !isLeftEdge) click(squares[currentId - 1]);
                if (currentId > 9 && !isRightEdge) click(squares[currentId + 1 - width]);
                if (currentId > 10) click(squares[currentId - width]);
                if (currentId > 11 && !isLeftEdge) click(squares[currentId - 1 - width]);
                if (currentId < 99 && !isRightEdge) click(squares[currentId + 1]);
                if (currentId < 90 && !isLeftEdge) click(squares[currentId - 1 + width]);
                if (currentId < 88 && !isRightEdge) click(squares[currentId + 1 + width]);
                if (currentId < 89) click(squares[currentId + width]);
            }, 10);
        }
        
        function gameOver() {
            isGameOver = true;
            squares.forEach(square => {
                if (square.classList.contains('bomb')) {
                    square.classList.add('bomb');
                    square.innerHTML = '💣';
                }
            });
            setTimeout(() => alert('BOOM! Game Over!'), 100);
        }
        
        function checkForWin() {
            let matches = 0;
            for (let i = 0; i < squares.length; i++) {
                if (squares[i].classList.contains('flagged') && squares[i].classList.contains('bomb')) {
                    matches++;
                }
            }
            if (matches === bombAmount) {
                alert('YOU WIN!');
                isGameOver = true;
            }
        }

        initGame();
    </script>
</body>
</html>
