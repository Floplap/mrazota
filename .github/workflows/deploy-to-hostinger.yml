name: Build and Deploy to Hostinger (FTP)

on:
  push:
    branches: [ main, ai/auto-fixes, ai/auto-fixes-clean ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install & build site (mrazota-site)
        run: |
          cd mrazota-site
          npm ci
          # generate prisma client if used
          if [ -f node_modules/.bin/prisma ]; then npx prisma generate || true; fi
          npm run build

      - name: Prepare upload directory
        run: |
          rm -rf upload
          mkdir -p upload
          # Copy the built site and necessary files. Hostinger will run `npm ci` if needed.
          cp -R mrazota-site/.next upload/ || true
          cp mrazota-site/package.json upload/ || true
          cp mrazota-site/package-lock.json upload/ || true
          cp -R mrazota-site/public upload/ || true
          cp mrazota-site/next.config.js upload/ || true
          cp -R mrazota-site/prisma upload/ || true
          cp -R hostinger_deploy upload/ || true

      - name: List upload contents
        run: ls -la upload || true

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: upload
          server-dir: ${{ secrets.HOSTINGER_FTP_PATH }}
          exclude: |
            .git*
            node_modules
            **/*.log
            **/*.zip

      - name: Notify
        run: echo "Deployment to Hostinger (via FTP) finished. Check Hostinger hPanel and server logs."
